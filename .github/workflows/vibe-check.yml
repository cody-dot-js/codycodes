name: Vibe Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Why the PR number: on pull_request, github.ref has the same shape for every PR. Never cancel a
  # run on main, so each post-merge run completes.
  group: vibe-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  DO_NOT_TRACK: 1

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Why no version: pnpm/action-setup reads package.json#packageManager.
      - name: Install pnpm 📦
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install Dependencies 📥
        run: pnpm install --frozen-lockfile

      - name: Format Check 🎨
        run: pnpm run fmt:check

      - name: Lint 🔍
        run: pnpm run lint

      - name: Type Check 🔎
        run: pnpm run typecheck

      - name: Test 🧪
        run: pnpm run test

      - name: Build 🏗️
        run: pnpm run build

      # Why: the drafts build is the only one that renders a post page and a markdown twin while
      # content/posts/ is empty.
      - name: Build with drafts 📝
        run: pnpm run build
        env:
          VITE_DRAFTS: "1"
